[project]
name = "spatialreal-avatar-python"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "spatialreal>=0.2.3,<0.3",
    "agora-token-builder>=1.0.0",
    "audioop-lts>=0.2.1; python_version >= \"3.13\"",
]

[tool.pytest.ini_options]
# `pytest tests/` from this directory: stop conftest lookup at tests/ so the
# package __init__ (which needs ten_runtime) is not imported on a laptop
# without the TEN runtime. The extension directory is deliberately not on
# sys.path: the modules import each other relatively, as the TEN addon loader
# requires, and tests/conftest.py exposes them as a package.
addopts = "--confcutdir=tests"
